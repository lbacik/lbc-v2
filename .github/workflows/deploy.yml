name: Deploy

# Reusable: called by release.yml right after a tag is built, and callable by
# hand to redeploy or roll back to any tag that already has an image in GHCR.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy (e.g. v1.10)'
        required: true
        type: string

concurrency:
  group: deploy-rum
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://lukaszbacik.com
    permissions:
      contents: read
      packages: read

    steps:
      # Take compose.prod.yaml from the tag being deployed, not from HEAD.
      - name: Checkout ${{ inputs.tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      # Mirrors the local `rum` docker context, so DOCKER_HOST=ssh://rum
      # resolves the same way here as it does on a workstation.
      - name: Configure SSH access to rum
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/gha-deploy
          chmod 600 ~/.ssh/gha-deploy
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host rum
            HostName rum.host.luka.sh
            Port 2211
            User debian
            IdentityFile ~/.ssh/gha-deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # Logging in here is enough: the CLI forwards the auth with the pull, so
      # the private image reaches rum's daemon without credentials landing on
      # the host.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        env:
          DOCKER_HOST: ssh://rum
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          NETWORK: main
          VIRTUAL_HOST: lukaszbacik.com,www.lukaszbacik.com
          LETSENCRYPT_HOST: lukaszbacik.com,www.lukaszbacik.com
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GOOGLE_RECAPTCHA_SITE_KEY: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
          GOOGLE_RECAPTCHA_SECRET: ${{ secrets.GOOGLE_RECAPTCHA_SECRET }}
          UMAMI_SCRIPT_URL: ${{ vars.UMAMI_SCRIPT_URL }}
          UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          SES_TENANT_NAME: ${{ vars.SES_TENANT_NAME }}
          SES_CONFIGURATION_SET: ${{ vars.SES_CONFIGURATION_SET }}
          SES_REGION: ${{ vars.SES_REGION }}
          MAIL_OPERATOR_RECIPIENT: ${{ vars.MAIL_OPERATOR_RECIPIENT }}
          SES_ACCESS_KEY_ID: ${{ secrets.SES_ACCESS_KEY_ID }}
          SES_SECRET_ACCESS_KEY: ${{ secrets.SES_SECRET_ACCESS_KEY }}
          MAIL_MODE: ${{ vars.MAIL_MODE }}
          MAIL_VALIDATION_UNTIL: ${{ vars.MAIL_VALIDATION_UNTIL }}
          MAIL_VALIDATION_TOKEN: ${{ secrets.MAIL_VALIDATION_TOKEN }}
        run: |
          # MailModeGate enforces these rules too, but only on the first
          # /contact request, so fail here before rollout instead.
          mode="${MAIL_MODE:-disabled}"
          case "$mode" in
            disabled|validation|enabled) ;;
            *) echo "::error::Unknown MAIL_MODE=$mode" >&2; exit 1 ;;
          esac
          # The SES key may be absent only while mail is disabled.
          if [ "$mode" != "disabled" ] && { [ -z "$SES_ACCESS_KEY_ID" ] || [ -z "$SES_SECRET_ACCESS_KEY" ]; }; then
            echo "::error::MAIL_MODE=$mode requires SES_ACCESS_KEY_ID and SES_SECRET_ACCESS_KEY" >&2
            exit 1
          fi
          # Validation is operator-restricted and time-bounded: it needs the
          # token and a window that has not already ended.
          if [ "$mode" = "validation" ]; then
            if [ -z "$MAIL_VALIDATION_TOKEN" ]; then
              echo "::error::MAIL_MODE=validation requires the MAIL_VALIDATION_TOKEN secret" >&2
              exit 1
            fi
            if ! until_ts=$(date -d "$MAIL_VALIDATION_UNTIL" +%s 2>/dev/null) || [ -z "$MAIL_VALIDATION_UNTIL" ]; then
              echo "::error::MAIL_MODE=validation requires a valid MAIL_VALIDATION_UNTIL, got '$MAIL_VALIDATION_UNTIL'" >&2
              exit 1
            fi
            if [ "$until_ts" -le "$(date +%s)" ]; then
              echo "::error::MAIL_VALIDATION_UNTIL=$MAIL_VALIDATION_UNTIL has already passed" >&2
              exit 1
            fi
          fi
          # --env-file /dev/null is load-bearing: without it compose reads the
          # repo's committed .env, and a missing secret here would silently
          # fall back to the dev APP_SECRET instead of failing the deploy.
          docker compose --env-file /dev/null -f compose.prod.yaml -p lbc-v2 \
            up -d --pull always --wait

      - name: Smoke test
        env:
          DOCKER_HOST: ssh://rum
        run: |
          # The first ever deploy also waits here for Let's Encrypt issuance.
          for _ in $(seq 1 20); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' https://lukaszbacik.com/ || true)
            if [ "$code" = "200" ]; then
              echo "site is up"
              exit 0
            fi
            sleep 15
          done
          echo "::error::site did not become healthy" >&2
          docker compose -p lbc-v2 logs --tail 100 || true
          exit 1
