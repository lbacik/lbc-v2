# Production stack for rum (and any other host running proxy-ssl).
#
# Deployed from CI against a remote daemon, so compose reads this file and the
# environment locally while the container runs on the target host:
#
#   DOCKER_HOST=ssh://rum docker compose --env-file /dev/null \
#     -f compose.prod.yaml -p lbc-v2 up -d --pull always --wait
#
# --env-file /dev/null matters: otherwise compose reads the repo's committed
# .env and the ${VAR:?} guards below resolve to dev values instead of failing.
#
# The project name is always passed explicitly with -p; nothing here relies on
# COMPOSE_PROJECT_NAME.

networks:
  default:
    name: "${NETWORK:-main}"
    external: true

services:
  app:
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    container_name: lbc-v2
    restart: "${RESTART:-unless-stopped}"
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:?APP_SECRET is required}"
      # Deployment-owned SES v2 tenant boundary for the contact form.
      # Non-secret boundary values are plain inputs; the dedicated IAM key
      # travels through the same env secret mechanism as APP_SECRET.
      # See docs/ses-tenant-mail.md (incl. two-key rotation).
      SES_TENANT_NAME: "${SES_TENANT_NAME:?SES_TENANT_NAME is required}"
      SES_CONFIGURATION_SET: "${SES_CONFIGURATION_SET:-lbc-first-contact-events}"
      SES_REGION: "${SES_REGION:-eu-central-1}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-no-reply@lukaszbacik.com}"
      MAIL_OPERATOR_RECIPIENT: "${MAIL_OPERATOR_RECIPIENT:?MAIL_OPERATOR_RECIPIENT is required}"
      # The dedicated IAM key is optional only while MAIL_MODE is disabled;
      # MailModeGate refuses validation/enabled without it.
      SES_ACCESS_KEY_ID: "${SES_ACCESS_KEY_ID:-}"
      SES_SECRET_ACCESS_KEY: "${SES_SECRET_ACCESS_KEY:-}"
      MAIL_MODE: "${MAIL_MODE:-disabled}"
      MAIL_VALIDATION_UNTIL: "${MAIL_VALIDATION_UNTIL:-}"
      MAIL_VALIDATION_TOKEN: "${MAIL_VALIDATION_TOKEN:-}"
      CONTACT_RATE_LIMIT: "${CONTACT_RATE_LIMIT:-5}"
      CONTACT_RATE_WINDOW_SECONDS: "${CONTACT_RATE_WINDOW_SECONDS:-3600}"
      RECAPTCHA_EXPECTED_HOSTNAME: "${RECAPTCHA_EXPECTED_HOSTNAME:-}"
      RECAPTCHA_SCORE_THRESHOLD: "${RECAPTCHA_SCORE_THRESHOLD:-0.5}"
      GOOGLE_RECAPTCHA_SITE_KEY: "${GOOGLE_RECAPTCHA_SITE_KEY}"
      GOOGLE_RECAPTCHA_SECRET: "${GOOGLE_RECAPTCHA_SECRET}"
      # nginx-proxy terminates TLS; trust only the directly connected proxy
      TRUSTED_PROXIES: REMOTE_ADDR
      # nginx-proxy / acme-companion discovery. VIRTUAL_PORT is not optional
      # here: the image exposes 80, 443 and 443/udp, so the port cannot be
      # inferred.
      VIRTUAL_HOST: "${VIRTUAL_HOST:?VIRTUAL_HOST is required}"
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: "${LETSENCRYPT_HOST:-${VIRTUAL_HOST}}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL}"
    healthcheck:
      # the runtime image carries no curl/wget; php is guaranteed present
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
