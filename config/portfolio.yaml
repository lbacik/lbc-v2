Fortune:
  image: fortune-01.jpeg
  category: Web
  filter: web
  slug: fortune
  type: Application
  url:
    name: fortune.luka.sh
    href: https://fortune.luka.sh
  carousel:
    - fortune-01.jpeg
    - fortune-02.jpeg
    - fortune-03.jpeg
  description: >
    <strong>Stack</strong>: React, Redux, Bootstrap, Python, FastAPI, ElasticSearch, Docker
    
    
    A web page that allows users to play with fortune cookies in the browser. The API is written in Python and 
    utilizes the <a href="https://pypi.org/project/lfortune/" target="_blank">lfortune</a> library 
    (another one of my projects), which also includes a CLI interface.
    
    
    For more information about the project, please visit the project's 
    <a href="https://fortune.luka.sh/#about" target="_blank">About</a> page!

PHP Architect:
  image: phparch-c1.jpeg
  category: Publication
  filter: pub
  slug: phparch
  type: Publication
  url:
    name: phparch.com
    href: https://www.phparch.com/article/value-objects/
  carousel:
    - phparch-1.jpeg
    - phparch-l2.jpeg
    - phparch-l3.jpeg
  description: >
    I was excited to receive a message from PHP Architect, one of the most respected PHP magazines in the world, 
