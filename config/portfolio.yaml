Value Object:
  image: vo-1.jpeg
  category: Library
  filter: lib
  slug: value-object
  type: Library
  url:
    name: value object
    href: https://packagist.org/packages/lbacik/value-object
  carousel:
    - vo-1.jpeg
    - vo-2.jpeg
  description: >
    The experiment I began a few years ago resulted in a modest library that I continue to utilize to this day.
    
    
    It is available on <a href="https://packagist.org/packages/lbacik/value-object" target="_blank">Packagist</a> / <a href="https://github.com/lbacik/value-object" target="_blank">GitHub</a>
    and you can read more about it on <a href="https://lbacik.medium.com/value-objects-2db63b9ef5e9" target="_blank">Medium</a>.
    
    
    The library is also a key focus of an article at <a href="https://www.phparch.com/article/value-objects/" target="_blank">PHP Architect</a>, 
    which I had the pleasure of publishing.
    
    
    The library contains the unit tests written using the PHPUnit framework, but there have also been phpspec tests 
    created (BDD), which can be found in the 
    <a href="https://github.com/lbacik/value-object-spec" target="_blank">value-object-spec</a> repository.

