# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    google_recaptcha_site_key: '%env(GOOGLE_RECAPTCHA_SITE_KEY)%'
    umami_script_url: '%env(UMAMI_SCRIPT_URL)%'
    umami_website_id: '%env(UMAMI_WEBSITE_ID)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Deployment-owned SES v2 client for the dedicated contact-form tenant.
    # Credentials are dedicated IAM keys injected through the environment.
    AsyncAws\Ses\SesClient:
        arguments:
            $configuration:
                region: '%env(SES_REGION)%'
                accessKeyId: '%env(SES_ACCESS_KEY_ID)%'
                accessKeySecret: '%env(SES_SECRET_ACCESS_KEY)%'

    # Immutable SES tenant boundary. Resolved from deployment configuration
    # only; request input can never override these values.
    App\Mail\MailBoundary:
        arguments:
            $tenantName: '%env(SES_TENANT_NAME)%'
            $configurationSetName: '%env(SES_CONFIGURATION_SET)%'
            $region: '%env(SES_REGION)%'
            $fromAddress: '%env(MAIL_FROM_ADDRESS)%'
            $operatorRecipient: '%env(MAIL_OPERATOR_RECIPIENT)%'

    # Deployment-owned mail mode: disabled (default) | validation | enabled.
    App\Mail\MailModeGate:
        arguments:
            $mode: '%env(MAIL_MODE)%'
            $validationUntil: '%env(MAIL_VALIDATION_UNTIL)%'
            $validationToken: '%env(MAIL_VALIDATION_TOKEN)%'
            $sesAccessKeyId: '%env(SES_ACCESS_KEY_ID)%'
            $sesSecretAccessKey: '%env(SES_SECRET_ACCESS_KEY)%'

    App\Mail\ContactRateLimiter:
        arguments:
            $pool: '@cache.app'
            $limit: '%env(int:CONTACT_RATE_LIMIT)%'
            $windowSeconds: '%env(int:CONTACT_RATE_WINDOW_SECONDS)%'

    App\Mail\RecaptchaVerifier:
        arguments:
            $expectedAction: 'php_email_form_submit'
            $expectedHostname: '%env(RECAPTCHA_EXPECTED_HOSTNAME)%'
            $scoreThreshold: '%env(float:RECAPTCHA_SCORE_THRESHOLD)%'
